catalogue_name: Legacy Survey DR10
source_catalogue_url: https://www.legacysurvey.org/dr10/files/#sweep-brickmin-brickmax-fits
comments:
  This catalogue includes the standard fields from the Legacy Survey DR10
  sweep catalogue, plus computed columns ls_id, gaia_dr2_source_id, and gaia_dr3_source_id.
source_catalogue_params:
  format: csv
  csv_delimiter: ','
  csv_has_header: true
  csv_comment_prefix: '#'
ra_column: ra
dec_column: dec
pmra_column: pmra
pmdec_column: pmdec
pmra_is_cosdec: true
columns:
  release:
    dtype: Int16
    description: Integer denoting the camera and filter set used
    unit: null
    source_catalogue:
      dtype: Int16
      column_name: RELEASE
  brickid:
    dtype: Int32
    description: Brick ID
    unit: null
    source_catalogue:
      dtype: Int32
      column_name: BRICKID
  brickname:
    dtype: String
    description: Name of brick encoding the sky position
    unit: null
    source_catalogue:
      dtype: String
      column_name: BRICKNAME
  objid:
    dtype: Int32
    description: Catalog object number within this brick
    unit: null
    source_catalogue:
      dtype: Int32
      column_name: OBJID
  type:
    dtype: String
    description: Morphological model (PSF, REX, DEV, EXP, SER, DUP)
    unit: null
    source_catalogue:
      dtype: String
      column_name: TYPE
  ra:
    dtype: Float64
    description: Right ascension at equinox J2000
    unit: deg
    source_catalogue:
      dtype: Float64
      column_name: RA
  dec:
    dtype: Float64
    description: Declination at equinox J2000
    unit: deg
    source_catalogue:
      dtype: Float64
      column_name: DEC
  ra_ivar:
    dtype: Float32
    description:
      Inverse variance of RA (no cosine term), excluding astrometric calibration
      errors
    unit: 1/deg^2
    source_catalogue:
      dtype: Float32
      column_name: RA_IVAR
  dec_ivar:
    dtype: Float32
    description: Inverse variance of DEC, excluding astrometric calibration errors
    unit: 1/deg^2
    source_catalogue:
      dtype: Float32
      column_name: DEC_IVAR
  ebv:
    dtype: Float32
    description: Galactic extinction E(B-V) reddening from SFD98
    unit: mag
    source_catalogue:
      dtype: Float32
      column_name: EBV
  flux_g:
    dtype: Float32
    description: Model flux in g
    unit: nanomaggy
    source_catalogue:
      dtype: Float32
      column_name: FLUX_G
  flux_r:
    dtype: Float32
    description: Model flux in r
    unit: nanomaggy
    source_catalogue:
      dtype: Float32
      column_name: FLUX_R
  flux_i:
    dtype: Float32
    description: Model flux in i
    unit: nanomaggy
    source_catalogue:
      dtype: Float32
      column_name: FLUX_I
  flux_z:
    dtype: Float32
    description: Model flux in z
    unit: nanomaggy
    source_catalogue:
      dtype: Float32
      column_name: FLUX_Z
  flux_w1:
    dtype: Float32
    description: WISE model flux in W1 (AB system)
    unit: nanomaggy
    source_catalogue:
      dtype: Float32
      column_name: FLUX_W1
  flux_w2:
    dtype: Float32
    description: WISE model flux in W2 (AB system)
    unit: nanomaggy
    source_catalogue:
      dtype: Float32
      column_name: FLUX_W2
  flux_w3:
    dtype: Float32
    description: WISE model flux in W3 (AB system)
    unit: nanomaggy
    source_catalogue:
      dtype: Float32
      column_name: FLUX_W3
  flux_w4:
    dtype: Float32
    description: WISE model flux in W4 (AB system)
    unit: nanomaggy
    source_catalogue:
      dtype: Float32
      column_name: FLUX_W4
  flux_ivar_g:
    dtype: Float32
    description: Inverse variance of flux_g
    unit: 1/nanomaggy^2
    source_catalogue:
      dtype: Float32
      column_name: FLUX_IVAR_G
  flux_ivar_r:
    dtype: Float32
    description: Inverse variance of flux_r
    unit: 1/nanomaggy^2
    source_catalogue:
      dtype: Float32
      column_name: FLUX_IVAR_R
  flux_ivar_i:
    dtype: Float32
    description: Inverse variance of flux_i
    unit: 1/nanomaggy^2
    source_catalogue:
      dtype: Float32
      column_name: FLUX_IVAR_I
  flux_ivar_z:
    dtype: Float32
    description: Inverse variance of flux_z
    unit: 1/nanomaggy^2
    source_catalogue:
      dtype: Float32
      column_name: FLUX_IVAR_Z
  flux_ivar_w1:
    dtype: Float32
