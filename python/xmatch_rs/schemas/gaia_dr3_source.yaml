  phot_bp_mean_flux:
    dtype: Float64
    unit: 'electron.s**-1'
    description: 'Integrated BP mean flux'
  phot_bp_mean_flux_error:
    dtype: Float32
    unit: 'electron.s**-1'
    description: 'Error on the integrated BP mean flux'
  phot_bp_mean_flux_over_error:
    dtype: Float32
    unit: ''
