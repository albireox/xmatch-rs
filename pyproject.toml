[project]
name = "xmatch-rs"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
dependencies = [
    "cloup>=3.0.9",
    "filelock>=3.25.2",
    "polars>=1.39.2",
    "pydantic>=2.12.5",
    "sdsstools>=1.9.7",
]

[project.scripts]
xmatch-rs = "xmatch_rs.cli:xmatch_rs_cli"

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "ipython>=9.11.0",
    "ruff>=0.15.6",
    "ty>=0.0.23",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=2.0.0",
    "nox>=2025.11.12",
    "sphinx-autobuild>=2021.3.14",
    "sphinx-copybutton>=0.4.0",
    "sphinx-autodoc-typehints>=1.23.2",
    "sphinx_inline_tabs>=2025.12.21.14",
]
test = [
    "pytest>=5.2.2",
    "pytest-asyncio>=0.10.0",
    "pytest-cov>=2.8.1",
    "pytest-mock>=1.13.0",
    "pytest-sugar>=0.9.2",
]

[tool.maturin]
python-source = "python"
module-name = "xmatch_rs._xmatch_rs_lib"
profile = "release"
editable-profile = "release"
strip = true
features = []

[tool.uv]
package = true
default-groups = ["dev", "docs", "test"]
# cache-keys = [{file = "pyproject.toml"}, {file = "Cargo.toml"}, {file = "**/*.rs"}]

[tool.ruff]
line-length = 88
target-version = 'py314'

[tool.ruff.lint]
select = ["E", "F", "I"]
unfixable = ["F841"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403", "E402", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["xmatch_rs"]
lines-after-imports = 2
section-order = ["future", "standard-library", "typing", "third-party", "sdss", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
typing = ["typing"]
sdss = ["sdsstools"]

[tool.ty.environment]
python-version = "3.14"
root = ["python"]

[tool.pytest.ini_options]
addopts = "--cov xmatch_rs --cov-report xml --cov-report html --cov-report term -W ignore"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
include = ["python/xmatch_rs/*"]
omit = [
    "python/xmatch_rs/__main__.py",
    "python/xmatch_rs/exceptions.py"
]

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
    "# pragma: no cover"
]

[build-system]
requires = ["maturin>=1.12,<2.0"]
build-backend = "maturin"
