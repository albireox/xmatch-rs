[package]
name = "xmatch-rs"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "xmatch_rs"
crate-type = ["cdylib"]

[dependencies]
cdshealpix = "0.9.1"
polars = "0.53.0"
pyo3 = "0.27.0"
pyo3-polars = { version = "0.26.0", features = ["derive", "dtype-struct", "dtype-array"] }
serde = { version = "1", features = ["derive"] }
