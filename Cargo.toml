[package]
name = "xmatch-rs"
version = "0.1.0-alpha.1"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "xmatch_rs"
crate-type = ["cdylib"]

# [profile.dev]
# opt-level = 1

# [profile.dev.package."*"]
# opt-level = 3

[dependencies]
anyhow = "1"
cdshealpix = "0.9.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
glob = "0.3.3"
polars = { version = "0.55.2", features = ["lazy", "dtype-u8", "object", "parquet", "strings", "trigonometry", "semi_anti_join", "is_in", "dtype-datetime", "timezones"] }
pyo3 = { version = "0.29", default-features = false,  features = ["extension-module", "anyhow"] }
pyo3-polars = { version = "0.28", features = ["derive", "lazy"] }
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4", "fast-rng"] }
regex = "1"
itertools = "0.14.0"
kdtree = "0.8.0"
numpy = "0.29.0"
pyo3-log = "0.13.4"
log = "0.4.32"
num-format = "0.4.4"
