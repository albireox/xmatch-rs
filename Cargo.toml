[package]
name = "xmatch-rs"
version = "0.1.0-alpha.1"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "xmatch_rs"
crate-type = ["cdylib"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dependencies]
anyhow = "1"
cdshealpix = "0.9.1"
polars = { version = "0.53.0", features = ["lazy", "default", "object", "parquet", "new_streaming"] }
pyo3 = { version = "^0.27", features = ["abi3-py311", "anyhow"] }
pyo3-polars = { version = "0.26.0", features = ["derive", "lazy"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "fast-rng"] }
